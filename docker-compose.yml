services:
  api:
    build:
      context: .
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.7.4}
    image: demucs-web:latest
    container_name: demucs-api
    restart: unless-stopped

    # 이 PC에서만 접속 가능(127.0.0.1). 앱에 로그인이 없으므로 0.0.0.0 으로 열지 말 것 —
    # 외부(다른 기기)에서 쓰려면 호스트에서 `tailscale serve` 로 노출한다 (README 참고).
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      OUTPUT_DIR: /data/output
      WORK_DIR: /data/work
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
      DEVICE: ${DEVICE:-auto}
      SHIFTS: ${SHIFTS:-1}
      OVERLAP: ${OVERLAP:-0.25}
      SEGMENT: ${SEGMENT:-}
      MP3_BITRATE: ${MP3_BITRATE:-320k}
      WAV_SUBTYPE: ${WAV_SUBTYPE:-PCM_16}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-900}
      MAX_QUEUE: ${MAX_QUEUE:-20}
      JOB_RETENTION_SEC: ${JOB_RETENTION_SEC:-0}
      # 쿠키를 쓸 때만 값을 넣는다 (.env 에서 COOKIES_FILE=/secrets/cookies.txt)
      COOKIES_FILE: ${COOKIES_FILE:-}
      # 403 이 나면 이 순서로 플레이어 클라이언트를 바꿔가며 재시도한다 (.env 에서 조정)
      YTDLP_CLIENTS: ${YTDLP_CLIENTS:-,android,tv,web_safari,ios,mweb}
      # 앱(Capacitor/Tauri)처럼 다른 오리진에서 부를 때만. 웹으로만 쓰면 비워둔다.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # funnel(인터넷 공개) 접속 허용. 로그인이 없는 앱이라 기본은 막는다 (app/access.py)
      ALLOW_FUNNEL: ${ALLOW_FUNNEL:-0}
      # 이 Tailscale 계정의 기기만 허용 (쉼표로 여러 개). 비우면 tailnet 기기 전부 허용
      TAILSCALE_ALLOW_USERS: ${TAILSCALE_ALLOW_USERS:-}
      # AI 악보 에이전트 (아래 agent 서비스)
      AGENT_URL: http://agent:8090

    volumes:
      # 결과물은 Windows 탐색기에서 바로 열 수 있게 바인드 마운트
      - ./data/output:/data/output
      # 작업용 임시 파일은 named volume — Windows 바인드마운트(drvfs)보다 훨씬 빠르다
      - work:/data/work
      # 쿠키 등 민감 파일. 이미지에 굽지 말고 읽기 전용으로만 마운트
      - ./secrets:/secrets:ro

    # 8GB VRAM 보호를 위해 워커는 1개로 직렬화되어 있다 (jobs.py).
    shm_size: "1gb"

  # AI 악보: 연주 영상의 악보 띠 → 악보 PDF + 송 맵. Claude Agent SDK, 로그인은 OAuth(구독) — API 키 없음.
  # 포트를 열지 않는다 (api 만 부른다). 인증은 README 'AI 악보' 참고.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: demucs-agent:latest
    container_name: demucs-agent
    restart: unless-stopped
    environment:
      # `docker compose run --rm agent claude setup-token` 으로 받은 토큰 (.env 에 넣는다)
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # 비우면 Claude Code 기본 모델
      AGENT_MODEL: ${AGENT_MODEL:-}
    volumes:
      - ./data/output:/data/output
      - agent-work:/work
      # 컨테이너 안에서 `claude` → /login 으로 로그인했을 때의 자격 증명
      - agent-home:/home/app/.claude

volumes:
  work:
  agent-work:
  agent-home:
