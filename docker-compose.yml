services:
  api:
    build:
      context: .
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.7.4}
    image: demucs-web:latest
    container_name: demucs-api
    restart: unless-stopped

    # 이 PC에서만 접속 가능(127.0.0.1). 앱에 로그인이 없으므로 0.0.0.0 으로 열지 말 것 —
    # 외부(다른 기기)에서 쓰려면 호스트에서 `tailscale serve` 로 노출한다 (README 참고).
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      OUTPUT_DIR: /data/output
      WORK_DIR: /data/work
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
      DEVICE: ${DEVICE:-auto}
      SHIFTS: ${SHIFTS:-1}
      OVERLAP: ${OVERLAP:-0.25}
      SEGMENT: ${SEGMENT:-}
      MP3_BITRATE: ${MP3_BITRATE:-320k}
      WAV_SUBTYPE: ${WAV_SUBTYPE:-PCM_16}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-900}
      MAX_QUEUE: ${MAX_QUEUE:-20}
      JOB_RETENTION_SEC: ${JOB_RETENTION_SEC:-0}
      # 쿠키를 쓸 때만 값을 넣는다 (.env 에서 COOKIES_FILE=/secrets/cookies.txt)
      COOKIES_FILE: ${COOKIES_FILE:-}
      # 403 이 나면 이 순서로 플레이어 클라이언트를 바꿔가며 재시도한다 (.env 에서 조정)
      YTDLP_CLIENTS: ${YTDLP_CLIENTS:-,android,tv,web_safari,ios,mweb}
      # 앱(Capacitor/Tauri)처럼 다른 오리진에서 부를 때만. 웹으로만 쓰면 비워둔다.
      CORS_ORIGINS: ${CORS_ORIGINS:-}

    volumes:
      # 결과물은 Windows 탐색기에서 바로 열 수 있게 바인드 마운트
      - ./data/output:/data/output
      # 작업용 임시 파일은 named volume — Windows 바인드마운트(drvfs)보다 훨씬 빠르다
      - work:/data/work
      # 쿠키 등 민감 파일. 이미지에 굽지 말고 읽기 전용으로만 마운트
      - ./secrets:/secrets:ro

    # 8GB VRAM 보호를 위해 워커는 1개로 직렬화되어 있다 (jobs.py).
    shm_size: "1gb"

volumes:
  work:
